name: Fetch AI news draft

on:
  schedule:
    # 每两天 UTC 01:00（北京时间 09:00）运行一次
    - cron: "0 1 */2 * *"
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write # 需要把生成的草稿提交回仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Generate draft
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }} # 可选，默认 deepseek
        run: python scripts/fetch_ai_news.py

      - name: Commit and push draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/drafts
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "chore: 自动生成 AI 前沿草稿 $(date +%F)"
            git push
          fi
